name: Publish Artist Hub to org repo

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repo (owner/name)"
        required: true
        default: "Bitcoin-For-The-Arts/Artist-Hub"
      target_branch:
        description: "Target branch"
        required: true
        default: "main"
      prefix:
        description: "Source folder to publish"
        required: true
        default: "artist-hub"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split subtree
        run: |
          git subtree split --prefix="${{ inputs.prefix }}" -b hub-split

      - name: Push to target repo
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PUSH_TOKEN: ${{ secrets.ARTIST_HUB_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "Missing secret ARTIST_HUB_PUSH_TOKEN"
            exit 1
          fi
          git remote add target "https://x-access-token:${PUSH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push -u target hub-split:"${TARGET_BRANCH}"

