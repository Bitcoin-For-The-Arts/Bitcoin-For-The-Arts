name: Sync to live deployment repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout org repo
        uses: actions/checkout@v4
        with:
          path: org-repo

      - name: Checkout personal deployment repo
        uses: actions/checkout@v4
        with:
          repository: dionwilson/bitcoinforthearts
          token: ${{ secrets.DION_PAT }}
          path: personal-repo

      - name: Sync files from org repo to deployment repo
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            org-repo/ personal-repo/

      - name: Commit and push to trigger Vercel deployment
        working-directory: personal-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to sync" && exit 0
          git commit -m "sync: ${{ github.event.head_commit.message }}"
          git push
